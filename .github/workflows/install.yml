name: Onboarding installer
on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/native/**'
      - 'scripts/docker/**'
      - 'docker/openframe/**'
      - 'scripts/tests/test-*.py'
      - 'server/test/benchmarks/native-ubuntu/codecs/**'
      - '.github/workflows/install.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/native/**'
      - 'scripts/docker/**'
      - 'docker/openframe/**'
      - 'scripts/tests/test-*.py'
      - 'server/test/benchmarks/native-ubuntu/codecs/**'
      - '.github/workflows/install.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n install.sh
      - run: shellcheck -x install.sh scripts/docker/openframe-docker
      - run: python3 scripts/tests/test-install.py
      - run: python3 scripts/tests/test-codec-prepare.py
